# 开发环境配置
spring:
  # MySQL 数据源
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/school_buddy?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    # 真实密码放在 application-local.yml（已被 gitignore），避免明文入库
    password: ${DB_PASSWORD:}

  # Redis 配置（仅当 app.aux.store=redis 时使用；默认 mysql 实现无需 Redis）
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

# 开发环境 CORS 白名单（Vite 开发服务器地址，仅本地开发使用）
# 生产环境不预置任何来源，部署时通过配置注入正式前端域名
app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001
