# 开发环境配置
spring:
  # MySQL 数据源
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/school_buddy?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    # 真实密码放在 application-local.yml（已被 gitignore），避免明文入库
    password: ${DB_PASSWORD:}

  # Redis 配置（注意：Boot 3 迁移点，spring.redis -> spring.data.redis）
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
