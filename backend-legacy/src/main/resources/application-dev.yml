# 开发环境配置
spring:
  # MySQL 数据源
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/school_buddy?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    # 真实密码放在 application-local.yml（已被 gitignore），避免明文入库
    password: ${DB_PASSWORD:}

  # Redis 配置
  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1ms

# 文件上传配置
file:
  # 上传文件存储路径
  upload-path: ./uploads/
  # 允许的文件类型
  allowed-extensions: jpg,jpeg,png,gif,pdf,doc,docx,xls,xlsx
  # 最大文件大小（10MB）
  max-size: 10485760
