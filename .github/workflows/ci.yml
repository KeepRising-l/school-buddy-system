name: CI

on:
  push:
    branches: [main, refactor/rewrite]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: 后端测试（backend-v2 · Java 17）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 单元测试
        run: mvn -f backend-v2/pom.xml test -B

  frontend-h5:
    name: H5 用户端构建（Vue3）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend-h5/package-lock.json

      - name: 安装依赖
        run: npm ci
        working-directory: frontend-h5

      - name: 构建
        run: npm run build
        working-directory: frontend-h5

  frontend-admin:
    name: 管理端构建（Vue3 + Element Plus）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend-admin/package-lock.json

      - name: 安装依赖
        run: npm ci
        working-directory: frontend-admin

      - name: 构建
        run: npm run build
        working-directory: frontend-admin
